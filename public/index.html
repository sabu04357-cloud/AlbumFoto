<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#c8b89a" />
  <title>Carica le tue foto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Cormorant Garamond", "Georgia", serif;
      background: #f5f0e8;
      color: #3d3425;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(40px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 6px;
      color: #2e2415;
      letter-spacing: 0.02em;
    }
    .sub {
      color: #8a7d6b;
      text-align: center;
      font-size: 1.1rem;
      font-style: italic;
      margin-bottom: 36px;
    }
    .btn {
      width: 100%;
      max-width: 420px;
      border-radius: 6px;
      padding: 18px 24px;
      font-family: "Cormorant Garamond", "Georgia", serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s;
      letter-spacing: 0.03em;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-primary {
      background: #a6926e;
      color: #fff;
      border: 2px solid #8a7a5a;
      box-shadow: 0 2px 8px rgba(120,100,60,0.25);
      margin-bottom: 12px;
    }
    .btn-secondary {
      background: transparent;
      color: #a6926e;
      border: 2px solid #c4b896;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
    }
    .thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: #e8dfd1;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 26px;
      height: 26px;
      border: 1.5px solid #8a7a5a;
      border-radius: 50%;
      background: rgba(245, 240, 232, 0.9);
      color: #9e3030;
      font-size: 15px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
    }
    .progress-wrap {
      width: 100%;
      max-width: 420px;
      height: 8px;
      background: #e0d7c7;
      border-radius: 999px;
      margin-top: 24px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #a6926e;
      border-radius: 999px;
      transition: width 0.2s;
    }
    .status { margin-top: 16px; font-size: 1rem; min-height: 1.4em; text-align: center; }
    .status.ok { color: #5a8a5a; }
    .status.err { color: #9e3030; }
    .count { color: #8a7d6b; font-size: 0.95rem; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Album Foto</h1>
  <p class="sub">Scatta o scegli le foto e condividile con noi</p>

  <input type="file" id="input-galleria" accept="image/*,video/*" multiple style="display:none" />
  <input type="file" id="input-fotocamera" accept="image/*" capture="environment" style="display:none" />

  <button class="btn btn-primary" id="btn-fotocamera" type="button">Scatta foto o video</button>
  <button class="btn btn-secondary" id="btn-galleria" type="button">Scegli dalla galleria</button>

  <div class="thumbs" id="thumbs"></div>
  <p class="count" id="count"></p>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <button class="btn btn-secondary" id="btn-invia" type="button" disabled>Invia foto</button>
  <p class="status" id="status"></p>

  <script>
    var inputGalleria = document.getElementById("input-galleria");
    var inputFotocamera = document.getElementById("input-fotocamera");
    var btnFotocamera = document.getElementById("btn-fotocamera");
    var btnGalleria = document.getElementById("btn-galleria");
    var btnInvia = document.getElementById("btn-invia");
    var thumbs = document.getElementById("thumbs");
    var countEl = document.getElementById("count");
    var statusEl = document.getElementById("status");
    var progressWrap = document.getElementById("progress-wrap");
    var progressBar = document.getElementById("progress-bar");

    var selezionate = [];

    function aggiornaUI() {
      thumbs.innerHTML = "";
      selezionate.forEach(function (file, i) {
        var div = document.createElement("div");
        div.className = "thumb";
        var isVideo = file.type && file.type.startsWith("video/");
        var preview;
        if (isVideo) {
          preview = document.createElement("video");
          preview.src = URL.createObjectURL(file);
          preview.muted = true;
          preview.loop = true;
          preview.playsInline = true;
          preview.autoplay = true;
        } else {
          preview = document.createElement("img");
          preview.src = URL.createObjectURL(file);
          preview.alt = "";
        }
        preview.onload = function () { URL.revokeObjectURL(preview.src || preview.currentSrc); };
        var rm = document.createElement("button");
        rm.className = "remove";
        rm.type = "button";
        rm.setAttribute("aria-label", "Rimuovi");
        rm.textContent = "\u00D7";
        rm.onclick = function () {
          selezionate.splice(i, 1);
          aggiornaUI();
        };
        div.appendChild(preview);
        div.appendChild(rm);
        thumbs.appendChild(div);
      });
      countEl.textContent =
        selezionate.length > 0 ? selezionate.length + " file selezionati" : "";
      btnInvia.disabled = selezionate.length === 0;
    }

    function apriInput(input) {
      input.value = "";
      input.click();
    }

    btnFotocamera.addEventListener("click", function () {
      apriInput(inputFotocamera);
    });

    btnGalleria.addEventListener("click", function () {
      apriInput(inputGalleria);
    });

    inputGalleria.addEventListener("change", function () {
      aggiungiFile(this.files);
    });

    inputFotocamera.addEventListener("change", function () {
      selezionate = [];
      aggiungiFile(this.files);
    });

    function aggiungiFile(files) {
      for (var i = 0; i < files.length; i++) {
        if (selezionate.length >= 60) break;
        selezionate.push(files[i]);
      }
      aggiornaUI();
    }

    btnInvia.addEventListener("click", function () {
      if (selezionate.length === 0) return;

      statusEl.textContent = "";
      statusEl.className = "status";
      btnInvia.disabled = true;
      btnFotocamera.disabled = true;
      btnGalleria.disabled = true;
      progressWrap.style.display = "block";
      progressBar.style.width = "0%";

      var formData = new FormData();
      selezionate.forEach(function (f) {
        formData.append("foto", f, f.name || "foto.jpg");
      });

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload");
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          progressBar.style.width = Math.round((e.loaded / e.total) * 100) + "%";
        }
      };
      xhr.onload = function () {
        progressWrap.style.display = "none";
        btnFotocamera.disabled = false;
        btnGalleria.disabled = false;
        if (xhr.status === 200) {
          selezionate = [];
          aggiornaUI();
          statusEl.textContent = "Foto inviate. Grazie!";
          statusEl.className = "status ok";
        } else {
          var msg = "Errore durante l'invio";
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
          statusEl.textContent = msg;
          statusEl.className = "status err";
          btnInvia.disabled = false;
        }
      };
      xhr.onerror = function () {
        progressWrap.style.display = "none";
        btnFotocamera.disabled = false;
        btnGalleria.disabled = false;
        btnInvia.disabled = false;
        statusEl.textContent = "Connessione non riuscita, riprova";
        statusEl.className = "status err";
      };
      xhr.send(formData);
    });
  </script>
</body>
</html>
