<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Carica le tue foto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }
    h1 { font-size: 1.6rem; text-align: center; margin-bottom: 8px; }
    .sub { color: #94a3b8; text-align: center; font-size: 0.95rem; margin-bottom: 28px; }
    .btn {
      width: 100%;
      max-width: 420px;
      border: none;
      border-radius: 14px;
      padding: 18px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-secondary {
      background: transparent;
      color: #38bdf8;
      border: 2px solid #38bdf8;
    }
    .thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
    }
    .thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: #1e293b;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .remove {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.85);
      color: #f87171;
      font-size: 14px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
    }
    .progress-wrap {
      width: 100%;
      max-width: 420px;
      height: 10px;
      background: #1e293b;
      border-radius: 999px;
      margin-top: 24px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38bdf8;
      border-radius: 999px;
      transition: width 0.2s;
    }
    .status { margin-top: 16px; font-size: 0.95rem; min-height: 1.4em; text-align: center; }
    .status.ok { color: #4ade80; }
    .status.err { color: #f87171; }
    .count { color: #94a3b8; font-size: 0.9rem; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Album Foto</h1>
  <p class="sub">Scatta o scegli le foto e condividile con noi</p>

  <input type="file" id="input-foto" accept="image/*" multiple style="display:none" />

  <button class="btn btn-primary" id="btn-scegli" type="button">Scatta o scegli foto</button>

  <div class="thumbs" id="thumbs"></div>
  <p class="count" id="count"></p>

  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <button class="btn btn-secondary" id="btn-invia" type="button" disabled>Invia foto</button>
  <p class="status" id="status"></p>

  <script>
    var input = document.getElementById("input-foto");
    var btnScegli = document.getElementById("btn-scegli");
    var btnInvia = document.getElementById("btn-invia");
    var thumbs = document.getElementById("thumbs");
    var countEl = document.getElementById("count");
    var statusEl = document.getElementById("status");
    var progressWrap = document.getElementById("progress-wrap");
    var progressBar = document.getElementById("progress-bar");

    var selezionate = [];

    function aggiornaUI() {
      thumbs.innerHTML = "";
      selezionate.forEach(function (file, i) {
        var div = document.createElement("div");
        div.className = "thumb";
        var img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.alt = "";
        img.onload = function () { URL.revokeObjectURL(img.src); };
        var rm = document.createElement("button");
        rm.className = "remove";
        rm.type = "button";
        rm.setAttribute("aria-label", "Rimuovi");
        rm.textContent = "\u00D7";
        rm.onclick = function () {
          selezionate.splice(i, 1);
          aggiornaUI();
        };
        div.appendChild(img);
        div.appendChild(rm);
        thumbs.appendChild(div);
      });
      countEl.textContent =
        selezionate.length > 0 ? selezionate.length + " foto selezionate" : "";
      btnInvia.disabled = selezionate.length === 0;
    }

    btnScegli.addEventListener("click", function () {
      input.value = "";
      input.click();
    });

    input.addEventListener("change", function () {
      for (var i = 0; i < input.files.length; i++) {
        if (selezionate.length >= 30) break;
        selezionate.push(input.files[i]);
      }
      aggiornaUI();
    });

    btnInvia.addEventListener("click", function () {
      if (selezionate.length === 0) return;

      statusEl.textContent = "";
      statusEl.className = "status";
      btnInvia.disabled = true;
      btnScegli.disabled = true;
      progressWrap.style.display = "block";
      progressBar.style.width = "0%";

      var formData = new FormData();
      selezionate.forEach(function (f) {
        formData.append("foto", f, f.name || "foto.jpg");
      });

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload");
      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          progressBar.style.width = Math.round((e.loaded / e.total) * 100) + "%";
        }
      };
      xhr.onload = function () {
        progressWrap.style.display = "none";
        btnScegli.disabled = false;
        if (xhr.status === 200) {
          selezionate = [];
          aggiornaUI();
          statusEl.textContent = "Foto inviate. Grazie!";
          statusEl.className = "status ok";
        } else {
          var msg = "Errore durante l'invio";
          try { msg = JSON.parse(xhr.responseText).error || msg; } catch (e) {}
          statusEl.textContent = msg;
          statusEl.className = "status err";
          btnInvia.disabled = false;
        }
      };
      xhr.onerror = function () {
        progressWrap.style.display = "none";
        btnScegli.disabled = false;
        btnInvia.disabled = false;
        statusEl.textContent = "Connessione non riuscita, riprova";
        statusEl.className = "status err";
      };
      xhr.send(formData);
    });
  </script>
</body>
</html>
